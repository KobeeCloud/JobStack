[defaults]
inventory          = inventory/
roles_path         = roles/
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = yaml
collections_path   = ~/.ansible/collections

[ssh_connection]
ssh_args = -o ForwardAgent=no -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=300s
pipelining = True
