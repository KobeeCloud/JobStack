---
# Production inventory
# Generated from terraform output vm_public_ips
# Update IPs after terraform apply

all:
  vars:
    ansible_user: deploy
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_python_interpreter: /usr/bin/python3
    environment: prod
    node_env: production
    app_port: 3000
    app_dir: /opt/jobstack

app_servers:
  hosts:
    jobstack-prod-01:
      ansible_host: "REPLACE_WITH_VM1_PUBLIC_IP"  # terraform output vm_public_ips | jq '.[0]'
    jobstack-prod-02:
      ansible_host: "REPLACE_WITH_VM2_PUBLIC_IP"  # terraform output vm_public_ips | jq '.[1]'
