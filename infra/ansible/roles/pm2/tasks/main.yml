---
# roles/pm2/tasks/main.yml

- name: Create PM2 ecosystem config
  ansible.builtin.template:
    src: ecosystem.config.js.j2
    dest: "{{ app_dir }}/ecosystem.config.js"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"

- name: Start application with PM2 (if not running)
  ansible.builtin.command: >
    pm2 start {{ app_dir }}/ecosystem.config.js --env {{ node_env }}
  become_user: "{{ app_user }}"
  args:
    creates: /home/{{ app_user }}/.pm2/pids/{{ app_name }}.pid
  ignore_errors: true  # Handled by reload below if already running

- name: Reload application with PM2 (zero-downtime)
  ansible.builtin.command: >
    pm2 reload {{ app_name }} --update-env
  become_user: "{{ app_user }}"
  changed_when: true

- name: Save PM2 process list
  ansible.builtin.command: pm2 save
  become_user: "{{ app_user }}"
  changed_when: true

- name: Configure PM2 startup (systemd)
  ansible.builtin.command: pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
  register: pm2_startup
  changed_when: pm2_startup.rc == 0

- name: Enable PM2 systemd service
  ansible.builtin.systemd:
    name: pm2-{{ app_user }}
    enabled: true
    daemon_reload: true

- name: Configure PM2 log rotation
  ansible.builtin.command: pm2 install pm2-logrotate
  become_user: "{{ app_user }}"
  args:
    creates: /home/{{ app_user }}/.pm2/modules/pm2-logrotate
