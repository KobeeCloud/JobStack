---
# roles/nginx/tasks/main.yml

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Install certbot (Let's Encrypt)
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Write nginx configuration
  ansible.builtin.template:
    src: jobstack.conf.j2
    dest: /etc/nginx/sites-available/jobstack
    mode: "0644"
    validate: nginx -t -c /etc/nginx/nginx.conf
  notify: Reload nginx

- name: Enable nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/jobstack
    dest: /etc/nginx/sites-enabled/jobstack
    state: link
  notify: Reload nginx

- name: Ensure nginx is enabled and started
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
