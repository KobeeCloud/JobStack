---
# roles/nodejs/tasks/main.yml

- name: Add NodeSource GPG key
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | \
      gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
  args:
    creates: /usr/share/keyrings/nodesource.gpg

- name: Add NodeSource repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ nodejs_version }}.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js {{ nodejs_version }}
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install global npm packages
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  loop: "{{ nodejs_npm_global_packages }}"

- name: Verify Node.js version
  ansible.builtin.command: node --version
  register: node_version
  changed_when: false

- name: Print Node.js version
  ansible.builtin.debug:
    msg: "Node.js installed: {{ node_version.stdout }}"
