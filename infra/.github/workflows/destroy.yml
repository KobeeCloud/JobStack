name: "Infra Destroy"
# DANGER — Destroys all Azure resources for a given environment.
# Manual trigger only. Requires typing the environment name to confirm.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to DESTROY"
        required: true
        type: choice
        options: [dev, prod]
      confirm:
        description: "Type the environment name again to confirm (dev/prod)"
        required: true

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.0"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  destroy:
    name: "DESTROY ${{ github.event.inputs.environment }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}  # Requires approval

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.environment }}" != "${{ github.event.inputs.confirm }}" ]; then
            echo "ERROR: Confirmation does not match environment. Aborting."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init

      - name: Terraform destroy
        run: |
          terraform destroy \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars" \
            -auto-approve \
            -input=false
