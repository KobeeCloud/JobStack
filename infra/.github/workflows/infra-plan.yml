name: "Infra Plan"
# Runs terraform plan on every PR that touches infra/terraform/**
# Posts the plan as a PR comment

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write  # OIDC for Azure auth — no stored credentials

env:
  TF_VERSION: "1.9.0"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: "Terraform Plan (${{ matrix.env }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
      fail-fast: false

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform fmt check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init
        id: init
        run: terraform init

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -var-file="environments/${{ matrix.env }}.tfvars" \
            -no-color \
            -out=plan-${{ matrix.env }}.tfplan 2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan-output.txt', 'utf8');
            const maxLen = 60000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... (truncated)'
              : plan;

            const body = `## Terraform Plan — \`${{ matrix.env }}\`

            | | Status |
            |---|---|
            | 📝 Format | ${{ steps.fmt.outcome == 'success' && '✅' || '❌' }} |
            | 🔍 Validate | ${{ steps.validate.outcome }} |
            | 📋 Plan | ${{ steps.plan.outcome }} |

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-${{ matrix.env }}
          path: infra/terraform/plan-${{ matrix.env }}.tfplan
          retention-days: 5
